services:
  - type: web
    name: foreclosure-finder
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      # Recorder of Deeds free account, used by the automatic parcel lookup.
      # Set the values in the Render dashboard (never committed).
      - key: RECORDER_USER
        sync: false
      - key: RECORDER_PASS
        sync: false
